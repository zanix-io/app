# .github/workflows/publish.yml

name: Publish

on:
  # Starts once the CI workflow (`ci.yml`) has COMPLETED for a push to `master`, instead of running
  # its checks again: CI runs on its own and publish waits for its result. `workflow_run` only fires
  # from the default branch's copy of this file, and for every CI run, so the job below filters to
  # a successful run caused by a push (never a pull request).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master

jobs:
  publish:
    # Publish is for `master` alone, whatever the CI workflow later runs on (pull requests, other
    # branches): the run must have PASSED, been caused by a `push`, been on `master`, and come from
    # this repository (never a fork). The `branches` filter above only narrows when the workflow
    # starts; this condition is what states the rule, so a change to `ci.yml`'s triggers cannot
    # widen it.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'master'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Allows reading of the repository's contents.
      id-token: write # Allows the creation of an ID token for authentication with JSR.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The exact commit CI validated, not whatever `master` has moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to Deno
        run: deno publish
